<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার বট ইনবক্স</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 15px; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        input, button { width: 100%; padding: 10px; margin-top: 8px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #0088cc; color: white; border: none; font-weight: bold; cursor: pointer; }
        .msg-box { border-bottom: 1px solid #eee; padding: 10px 0; }
        .sender { font-weight: bold; color: #0088cc; }
        .text { margin-top: 4px; color: #333; }
        .reply-input { margin-top: 5px; display: flex; gap: 5px; }
        .reply-input input { margin: 0; }
        .reply-input button { width: auto; }
    </style>
</head>
<body>

    <h2>🤖 বট মেসেজ সেন্টার</h2>

    <div class="card" id="token-card">
        <h3>বট টোকেন দিন:</h3>
        <input type="text" id="botToken" placeholder="BotFather-এর টোকেন এখানে দিন">
        <button onclick="startApp()">অ্যাপ চালু করুন</button>
    </div>

    <div id="messages-container"></div>

    <script>
        let token = "";
        let lastUpdateId = 0;

        function startApp() {
            token = document.getElementById("botToken").value.trim();
            if(!token) return alert("দয়া করে একটি টোকেন দিন!");
            
            document.getElementById("token-card").style.display = "none";
            fetchMessages();
            setInterval(fetchMessages, 3000);
        }

        async function fetchMessages() {
            try {
                let res = await fetch(`https://api.telegram.org/bot${token}/getUpdates?offset=${lastUpdateId + 1}`);
                let data = await res.json();
                
                if(data.ok && data.result.length > 0) {
                    data.result.forEach(item => {
                        if(item.message) {
                            lastUpdateId = item.update_id;
                            displayMessage(item.message);
                        }
                    });
                }
            } catch (e) {
                console.error("Error fetching messages", e);
            }
        }

        function displayMessage(msg) {
            let container = document.getElementById("messages-container");
            let div = document.createElement("div");
            div.className = "card msg-box";
            
            let name = msg.from.first_name || "Unknown User";
            let text = msg.text || "[ছবি বা অন্য মিডিয়া]";
            let chatId = msg.chat.id;

            div.innerHTML = `
                <div class="sender">👤 ${name} (ID: ${chatId})</div>
                <div class="text">💬 ${text}</div>
                <div class="reply-input">
                    <input type="text" id="reply-${chatId}" placeholder="রিপ্লাই লিখুন...">
                    <button onclick="sendReply('${chatId}')">পাঠান</button>
                </div>
            `;
            container.prepend(div);
        }

        async function sendReply(chatId) {
            let replyText = document.getElementById(`reply-${chatId}`).value;
            if(!replyText) return;

            await fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(replyText)}`);
            alert("রিপ্লাই পাঠানো হয়েছে!");
            document.getElementById(`reply-${chatId}`).value = "";
        }
    </script>

</body>
</html>
